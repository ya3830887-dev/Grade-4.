<style>

.q{font-size:20px;direction:ltr;text-align:left;margin:10px 0;line-height:1.5}
.bar{height:8px;background:#aab3d955;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:14px;margin-bottom:6px}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid #aab3d9;direction:ltr;background:var(--card);color:var(--tx)}
.fb{margin-top:8px;font-weight:600}.big{font-size:44px;text-align:center}.link{background:none;color:var(--mu);font-size:14px}
.hd{background:var(--pr);color:#fff;font-weight:700;font-size:20px;padding:16px;margin:-16px -16px 16px;direction:ltr}
.gold{border:3px solid var(--gold);text-align:center}.ayah{color:var(--pr);font-size:20px;line-height:2}.ph{color:#4caf6d;font-size:30px;font-weight:800;letter-spacing:1px}
.wa{display:block;text-align:center;text-decoration:none;background:#62cf72;color:#fff;border-radius:12px;padding:14px;margin:12px 0;font-weight:700}
.sc{font-size:64px;font-weight:800;color:var(--gold)}input.nm{text-align:center}

<script>

const GR=`She ___ (eat) fresh vegetables every day.#eats

const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/does not/g,"doesn't").replace(/do not/g,"don't").replace(/\s+/g," ").trim();
const $=document.getElementById("app");let S={};
let NAME="";
function welcome(){$.innerHTML=`<div class="card gold"><div class="ayah">﴿ إِنَّ اللَّهَ وَمَلَائِكَتَهُ يُصَلُّونَ عَلَى النَّبِيِّ يَا أَيُّهَا الَّذِينَ آمَنُوا صَلُّوا عَلَيْهِ وَسَلِّمُوا تَسْلِيمًا ﴾</div><h2>طلاب مستر يوسف الوكيل</h2><div class="ph">01098102012</div></div><p class="s" style="font-size:18px;color:var(--tx)">Welcome! Write your name to start:</p><input id="nm" class="nm" placeholder="Your name" autocomplete="off"><div style="text-align:center"><button style="width:auto;padding:12px 36px;margin-top:14px" onclick="go()">Start</button></div>`}
function go(){let v=document.getElementById("nm").value.trim();if(!v){document.getElementById("nm").style.borderColor="var(--no)";return}NAME=v;home()}
function home(){if(!NAME)return welcome();$.innerHTML=`<h1>🎮 Unit 1 Challenge</h1><p class="s">اختار نوع التحدي</p>
<div class="card"><h3>🔤 اختر الكلمة الصحيحة</h3><p class="s">Choose the correct answer</p>${grid("mc",MC.length)}</div>
<div class="card"><h3>✏️ تصحيح الجرامر</h3><p class="s">Correct the form of the word</p>${grid("gr",GR.length)}</div>`}
function grid(t,n){let h='<div class="g">';for(let i=0;i<Math.ceil(n/20);i++){let a=i*20+1,b=Math.min(n,a+19);h+=`<button onclick="start('${t}',${i})">تحدي ${i+1}<br><small>${a}–${b}</small></button>`}return h+"</div>"}
function start(t,i){let d=t=="mc"?MC:GR;S={t,i,qs:d.slice(i*20,i*20+20),n:0,sc:0,done:false};show()}
function show(){let q=S.qs[S.n],p=S.n/S.qs.length*100;
let h=`<div class="top"><span>سؤال ${S.n+1}/${S.qs.length}</span><span>⭐ ${S.sc}</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="card"><div class="q">${q.q.replace("___","<b>_____</b>")}</div>`;
if(S.t=="mc")h+=q.o.map((o,i)=>`<button class="o" onclick="pick(${i})">${"abcd"[i]}. ${o}</button>`).join("");
else h+=`<input id="in" autocomplete="off" autocapitalize="off" placeholder="Type your answer"><button onclick="chk()">تأكيد ✔</button>`;
$.innerHTML=h+`<div id="fb" class="fb"></div></div>`;
let e=document.getElementById("in");if(e)e.onkeydown=k=>{if(k.key=="Enter")chk()}}
function fin(ok,ans){if(S.done)return;S.done=true;if(ok)S.sc++;
document.getElementById("fb").innerHTML=(ok?'<span style="color:var(--ok)">✅ صح! Well done</span>':`<span style="color:var(--no)">❌ غلط — الإجابة: <b dir="ltr">${ans}</b></span>`)+'<button onclick="nxt()">التالي ➡</button>'}
function pick(i){if(S.done)return;let q=S.qs[S.n];document.querySelectorAll(".o").forEach((b,j)=>{if(j==q.a)b.classList.add("ok");else if(j==i)b.classList.add("no")});fin(i==q.a,q.o[q.a])}
function chk(){if(S.done)return;let q=S.qs[S.n],v=document.getElementById("in");let ok=norm(v.value)==norm(q.a);v.style.borderColor=ok?"var(--ok)":"var(--no)";v.disabled=true;fin(ok,q.a)}
function nxt(){S.done=false;S.n++;if(S.n<S.qs.length)show();else end()}
function end(){let pc=Math.round(S.sc/S.qs.length*100),tp=(S.t=="mc"?"Choose the correct answer":"Grammar Correction")+" - Challenge "+(S.i+1);
let msg=pc>=90?"Excellent! 🏆":pc>=60?"Very good! 👏":"Keep trying, you can do it! 📚";
let wa="https://wa.me/201098102012?text="+encodeURIComponent(`Unit 1 Challenge - Grade 4\nName: ${NAME}\nTopic: ${tp}\nScore: ${S.sc}/${S.qs.length} (${pc}%)`);
$.innerHTML=`<div class="card gold"><div class="sc">${S.sc}/${S.qs.length}</div><h3>${pc}% — ${msg}</h3><p class="s">${NAME}<br>${tp}</p></div><a class="wa" href="${wa}" target="_blank" rel="noopener">📲 Share score on WhatsApp</a><button onclick="start('${S.t}',${S.i})">🔁 Try again</button><button onclick="home()">Choose another topic</button>`}
